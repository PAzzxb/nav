<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>溜溜 · TG SOCKS5 代理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { text-align: center; padding: 32px 0 24px; }
  h1 { font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
  h1 i { color: #38bdf8; }
  .subtitle { color: #94a3b8; margin-top: 8px; font-size: 14px; }
  .controls { background: rgba(30,41,59,0.7); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); }
  .search-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .search-row input { flex: 1; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 16px; color: #e2e8f0; font-size: 15px; outline: none; }
  .search-row input:focus { border-color: #38bdf8; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { background: rgba(51,65,85,0.5); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 16px; color: #cbd5e1; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover { background: rgba(56,189,248,0.15); }
  .filter-btn.active { background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; border-color: transparent; }
  .stats { display: flex; gap: 20px; margin-bottom: 20px; font-size: 13px; color: #94a3b8; }
  .stats span { color: #38bdf8; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: rgba(30,41,59,0.6); backdrop-filter: blur(12px); border-radius: 14px; padding: 18px; border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s; }
  .card:hover { transform: translateY(-2px); border-color: rgba(56,189,248,0.3); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-location { font-weight: 700; font-size: 16px; }
  .card-type { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(56,189,248,0.15); color: #38bdf8; }
  .card-detail { font-size: 12px; color: #94a3b8; margin-bottom: 14px; line-height: 1.6; }
  .card-detail div { display: flex; justify-content: space-between; }
  .card-detail span:last-child { color: #e2e8f0; font-family: monospace; }
  .connect-btn { display: block; width: 100%; text-align: center; background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; transition: opacity 0.2s; }
  .connect-btn:hover { opacity: 0.9; }
  .loading { text-align: center; padding: 60px 20px; color: #94a3b8; }
  .empty { text-align: center; padding: 60px 20px; color: #64748b; }
  .refresh-btn { background: rgba(56,189,248,0.15); color: #38bdf8; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: rgba(56,189,248,0.25); }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  #updateTime { font-size: 12px; color: #64748b; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><i class="fa-brands fa-telegram"></i> 溜溜 TG SOCKS5 代理</h1>
    <p class="subtitle">每日自动同步 watchttvv/free-proxy-list · 点击直连 Telegram</p>
  </header>

  <div class="controls">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="搜索国家、城市...">
      <button class="refresh-btn" id="refreshBtn"><i class="fa-solid fa-rotate-right"></i> 刷新</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="机房">机房</button>
      <button class="filter-btn" data-filter="原生IP">原生IP</button>
      <button class="filter-btn" data-filter="家宽">家宽</button>
    </div>
  </div>

  <div class="topbar">
    <div class="stats">
      共 <span id="totalCount">0</span> 个节点
    </div>
    <div id="updateTime"></div>
  </div>

  <div class="grid" id="proxyGrid">
    <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 正在拉取代理列表...</div>
  </div>
</div>

<script>
const PROXY_SOURCE = 'tgsocks5.json';
let allProxies = [];
let currentFilter = 'all';
let searchQuery = '';

const grid = document.getElementById('proxyGrid');
const searchInput = document.getElementById('searchInput');
const refreshBtn = document.getElementById('refreshBtn');
const filterBtns = document.querySelectorAll('.filter-btn');
const updateTime = document.getElementById('updateTime');
const totalCount = document.getElementById('totalCount');

function parseProxyLine(line) {
  const m = line.match(/^socks5:\/\/([^:]+):(\d+)\s+(.+)$/);
  if (!m) return null;
  const host = m[1];
  const port = parseInt(m[2], 10);
  const rest = m[3];

  const restClean = rest.replace(/^\S+\s+/, '');
  const locMatch = restClean.match(/[\u4e00-\u9fa5]+/g);
  let location = '未知';
  if (locMatch && locMatch.length >= 2) {
    location = locMatch[0] + ' ' + locMatch[1];
  } else if (locMatch && locMatch.length === 1) {
    location = locMatch[0];
  }

  const isDatacenter = rest.includes('[机房]');
  const isNative = rest.includes('[原生IP]');

  return {
    server: host,
    port: port,
    location: location.trim(),
    type: isDatacenter ? '机房' : (isNative ? '原生IP' : '家宽')
  };
}

function loadProxies() {
  grid.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 正在拉取代理列表...</div>';

  var xhr = new XMLHttpRequest();
  xhr.open('GET', PROXY_SOURCE + '?t=' + Date.now(), true);
  xhr.onload = function() {
    if (xhr.status !== 200) {
      grid.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i><p>请求失败: HTTP ' + xhr.status + '</p></div>';
      return;
    }
    try {
      var data = JSON.parse(xhr.responseText);
      allProxies = data.proxies || [];
      totalCount.textContent = allProxies.length;
      updateTime.textContent = '更新时间: ' + new Date().toLocaleTimeString('zh-CN');
      renderList();
    } catch (e) {
      grid.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i><p>解析数据失败: ' + e.message + '</p></div>';
    }
  };
  xhr.onerror = function() {
    grid.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i><p>网络错误，无法加载代理数据</p></div>';
  };
  xhr.send();
}

function renderList() {
  const filtered = allProxies.filter(p => {
    const s = searchQuery.toLowerCase();
    const matchesSearch = !s || p.location.toLowerCase().includes(s);
    const matchesFilter = currentFilter === 'all' || p.type === currentFilter;
    return matchesSearch && matchesFilter;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty"><i class="fa-solid fa-box-open text-4xl mb-3"></i><p>未找到符合条件的代理节点</p></div>';
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(p => {
    const deepLink = 'tg://proxy?server=' + encodeURIComponent(p.server) + '&port=' + p.port;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-header">' +
        '<div class="card-location">' + p.location + '</div>' +
        '<div class="card-type">' + p.type + '</div>' +
      '</div>' +
      '<div class="card-detail">' +
        '<div><span>服务器:</span><span>' + p.server + '</span></div>' +
        '<div><span>端口:</span><span>' + p.port + '</span></div>' +
      '</div>' +
      '<a href="' + deepLink + '" class="connect-btn">' +
        '<i class="fa-solid fa-bolt"></i> 连接 Telegram' +
      '</a>';
    grid.appendChild(card);
  });
}

searchInput.addEventListener('input', () => { searchQuery = searchInput.value; renderList(); });
refreshBtn.addEventListener('click', loadProxies);
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

loadProxies();
</script>
</body>
</html>
