<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>全网盘搜 · 分类筛选版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #5b6e8c;
            --border-color: #e9eef3;
            --accent-color: #1e3c72;
            --accent-hover: #0f2b4f;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --result-bg: rgba(30, 60, 114, 0.05);
            --input-bg: rgba(255, 255, 255, 0.4);
            --tag-bg: #eef2ff;
            --password-tag: #fef3c7;
            --filter-active: #1e3c72;
            --filter-inactive: #e2e8f0;
        }

        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #60a5fa;
            --accent-hover: #3b82f6;
            --glass-bg: rgba(0, 0, 0, 0.3);
            --glass-border: rgba(255, 255, 255, 0.1);
            --result-bg: rgba(96, 165, 250, 0.1);
            --input-bg: rgba(30, 41, 59, 0.6);
            --tag-bg: #334155;
            --password-tag: #451a03;
            --filter-active: #60a5fa;
            --filter-inactive: #334155;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .theme-toggle {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 40px;
        }

        .search-header {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 32px 40px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #4a6cf7, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin: 15px 0 20px 0;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .avatar:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
        }

        .sub {
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-size: 1rem;
        }

        .search-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-input {
            flex: 1;
            min-width: 300px;
            padding: 16px 24px;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
            border-radius: 60px;
            background: var(--input-bg);
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        .search-btn {
            min-width: 140px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 60px;
            padding: 0 32px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-btn:hover {
            background: var(--accent-hover);
            transform: scale(0.98);
        }

        .stats {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--result-bg);
            padding: 8px 20px;
            border-radius: 40px;
            display: inline-block;
        }

        /* 筛选栏样式 */
        .filter-bar {
            margin: 20px 0 28px 0;
            background: var(--card-bg);
            border-radius: 60px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding-left: 8px;
        }

        .filter-chip {
            background: var(--filter-inactive);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-primary);
            border: none;
        }

        .filter-chip.active {
            background: var(--filter-active);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .filter-chip:hover:not(.active) {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        .clear-filter {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .clear-filter:hover {
            background: var(--result-bg);
            color: var(--accent-color);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -12px rgba(0,0,0,0.2);
        }

        .card-content {
            padding: 20px 24px;
        }

        .resource-title {
            font-weight: 700;
            font-size: 1.2rem;
            line-height: 1.4;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 0.75rem;
        }

        .badge {
            background: var(--tag-bg);
            padding: 4px 12px;
            border-radius: 40px;
            color: var(--text-primary);
        }

        .password-badge {
            background: var(--password-tag);
            color: #b45309;
        }

        .note {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 12px 0;
            background: var(--result-bg);
            padding: 10px 12px;
            border-radius: 16px;
            word-break: break-word;
        }

        .link-btn {
            display: block;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 12px;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }

        .link-btn:hover {
            background: var(--accent-hover);
        }

        .footer-info {
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
            padding: 12px 20px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
        }

        .empty-state, .error-state {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 60px 24px;
            text-align: center;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            font-size: 1rem;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1rem;
            color: var(--accent-color);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* FongMi 桥接状态条 */
        #fmBanner {
            display: none;
            margin: 14px 0 0;
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: left;
        }
        #fmBanner.show { display: block; }
        #fmBanner.ok {
            background: #eafaf0;
            color: #116637;
            border: 1px solid #b9e6cb;
        }
        #fmBanner.no {
            background: #fdf3e7;
            color: #8a5a16;
            border: 1px solid #f3ddba;
        }
        #fmBanner .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: 1px;
        }
        #fmBanner.ok .dot { background: #16a34a; }
        #fmBanner.no .dot { background: #d97706; }

        /* 弹窗 */
        #mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(23, 17, 48, 0.55);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
        }
        #mask.show { display: flex; }
        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 560px;
            border-radius: 22px 22px 0 0;
            padding: 22px 20px 26px;
            animation: up .22s ease;
        }
        @keyframes up {
            from { transform: translateY(40px); opacity: .4; }
        }
        .modal h3 {
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-all;
            padding-right: 26px;
        }
        .x {
            position: absolute;
            top: 14px;
            right: 16px;
            border: none;
            background: #f1f2f6;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 15px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .minfo {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 10px 0 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .linkbox {
            margin-top: 12px;
            background: var(--result-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 11px 13px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.8rem;
            word-break: break-all;
            color: var(--text-primary);
            line-height: 1.6;
        }
        .linkbox b { color: var(--accent-color); }
        .mbtns {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .mbtns button {
            flex: 1;
            min-width: 110px;
            height: 46px;
            border: none;
            border-radius: 13px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btnPlay {
            background: var(--accent-color);
            color: white;
        }
        .btnCopy {
            background: var(--tag-bg);
            color: var(--text-primary);
            border: 1.5px solid var(--border-color);
        }
        .btnOpen {
            background: var(--result-bg);
            color: var(--accent-color);
            border: 1.5px solid var(--border-color);
        }
        .tip {
            margin-top: 14px;
            font-size: 0.74rem;
            color: var(--text-secondary);
            line-height: 1.7;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
        }
        .spin2 {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2.5px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: -2px;
            margin-right: 7px;
        }
        #dlgMsg {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #dc2626;
            display: none;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            .container { padding: 16px; padding-top: 80px; }
            .search-header { padding: 24px 20px; }
            h1 { font-size: 1.6rem; }
            .search-input { min-width: 100%; font-size: 1rem; padding: 14px 20px; }
            .search-btn { min-width: 100%; padding: 14px 20px; }
            .results-grid { grid-template-columns: 1fr; gap: 16px; }
            .theme-toggle { top: 70px; right: 15px; width: 40px; height: 40px; font-size: 20px; }
            .avatar { width: 65px; height: 65px; }
            .filter-bar { border-radius: 30px; padding: 8px 12px; gap: 8px; }
            .filter-chip { padding: 6px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">🌙</div>

    <div class="container">
        <div class="search-header">
            <h1>全网盘搜</h1>
            <div class="avatar-wrapper">
                <div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:linear-gradient(135deg,#7c3aed,#a78bfa);">🛸</div>
            </div>
            <div class="sub">🚀 代理加速 · 智能缓存 · 按盘分类筛选</div>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="输入电影、剧集、短剧、书籍、音乐、软件、资料">
                <button id="searchBtn" class="search-btn">🔍 极速搜索</button>
            </div>
            <div id="statsArea" class="stats">✨ 代理加速已启用 · 支持网盘分类筛选</div>
        </div>

        <!-- FongMi 桥接状态条 -->
        <div id="fmBanner"><span class="dot"></span><span id="fmBannerTxt"></span></div>

        <!-- 筛选栏：动态显示网盘类型 -->
        <div id="filterBar" class="filter-bar" style="display: none;">
            <span class="filter-label">📂 按网盘筛选：</span>
            <div id="filterChipsContainer" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            <button id="clearFilterBtn" class="clear-filter">✖️ 清除筛选</button>
        </div>

        <div id="resultsContainer" class="results-grid">
            <div class="empty-state">
                🚀 代理加速版搜索站已就绪<br>
                ✅ 支持网盘分类筛选（百度/阿里/夸克/迅雷）<br>
                💡 试试搜索「死神来了」「短剧」「蜜语纪」等关键词
            </div>
        </div>
    </div>

    <!-- 链接弹窗 -->
    <div id="mask">
        <div class="modal">
            <button class="x" id="mClose">✕</button>
            <h3 id="mTitle"></h3>
            <div class="minfo">
                <span class="badge" id="mBadge" style="width:auto;padding:0 10px;height:24px;border-radius:7px">夸克</span>
                <span id="mTime"></span>
            </div>
            <div class="linkbox" id="mLink" style="display:none"></div>
            <div class="linkbox" id="mLoad" style="text-align:center;color:var(--text-secondary)"><span class="spin2"></span>正在解析真实链接…</div>
            <div id="dlgMsg"></div>
            <div class="mbtns" id="mBtns">
                <button class="btnPlay" id="mPlay" style="display:none">▶ 跳转播放</button>
                <button class="btnCopy" id="mCopy" style="display:none">复制链接</button>
                <button class="btnOpen" id="mOpen" style="display:none">打开链接</button>
            </div>
            <div class="tip" id="mTip">提示：链接为网盘分享地址，保存到自己的网盘后即可观看完整内容。</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            /* ================= 配置 ================= */
            const ORIGIN_API = 'https://so.252035.xyz/api/search?kw=';
            const PROXY_API = 'https://seep.eu.org/';
            const USE_PROXY = true;

            const cache = new Map();
            let currentFilterType = 'all';
            let currentRawResults = [];
            let currentKeyword = '';

            /* ================= FongMi 桥 ================= */
            let _fmP = null;
            function fmReady() {
                if (_fmP) return _fmP;
                _fmP = new Promise(function(res) {
                    if (window.fm) return res(window.fm);
                    let t = 0;
                    let iv = setInterval(function() {
                        t += 80;
                        if (window.fm || t > 4000) {
                            clearInterval(iv);
                            res(window.fm || null);
                        }
                    }, 80);
                });
                return _fmP;
            }

            function fmPlay(real, title) {
                fmReady().then(function(fm) {
                    if (!fm) return;
                    var name = panNameByUrl(real);
                    var code = panCode(name);
                    if (fm.pan && fm.pan.play) {
                        fm.pan.play({ type: code, url: real, password: '', title: title })
                            .catch(function() {
                                if (fm.play) fm.play(/^magnet:/i.test(real) ? real : ('push://' + real), title);
                            });
                        return;
                    }
                    if (fm.play) fm.play(/^magnet:/i.test(real) ? real : ('push://' + real), title);
                });
            }

            /* ================= 网盘类型 ================= */
            function getDiskType(url) {
                if (!url) return '🔗 网盘链接';
                if (url.includes('pan.baidu.com')) return '📀 百度网盘';
                if (url.includes('aliyundrive.com')) return '☁️ 阿里云盘';
                if (url.includes('quark.cn')) return '⚛️ 夸克网盘';
                if (url.includes('xunlei.com') || url.includes('pan.xunlei.com')) return '⚡ 迅雷网盘';
                return '🔗 网盘链接';
            }

            function getPureDiskType(url) {
                const type = getDiskType(url);
                if (type === '📀 百度网盘') return '百度网盘';
                if (type === '☁️ 阿里云盘') return '阿里云盘';
                if (type === '⚛️ 夸克网盘') return '夸克网盘';
                if (type === '⚡ 迅雷网盘') return '迅雷网盘';
                return '其他';
            }

            function panNameByUrl(u) {
                u = String(u || '');
                if (/pan\.quark\.cn/i.test(u)) return '夸克';
                if (/aliyundrive\.com|alipan\.com/i.test(u)) return '阿里';
                if (/pan\.baidu\.com|yun\.baidu\.com/i.test(u)) return '百度';
                if (/pan\.xunlei\.com/i.test(u)) return '迅雷';
                return '其他';
            }

            function panCode(name) {
                var m = { '夸克': 'quark', '阿里': 'aliyun', '百度': 'baidu', '迅雷': 'xunlei' };
                return m[name] || name;
            }

            function typeColor(name) {
                var c = { '夸克': '#4f8bff', '阿里': '#ff6a00', '百度': '#06a7ff', '迅雷': '#2f6df0' };
                return c[name] || '#9aa0ad';
            }

            function buildApiUrl(keyword) {
                const encodedKw = encodeURIComponent(keyword);
                if (USE_PROXY) return PROXY_API + ORIGIN_API + encodedKw;
                return ORIGIN_API + encodedKw;
            }

            async function fetchWithTimeout(url, timeout, retries) {
                timeout = timeout || 8000;
                retries = retries || 1;
                for (let i = 0; i <= retries; i++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeout);
                        const response = await fetch(url, {
                            signal: controller.signal,
                            headers: { 'Accept': 'application/json' }
                        });
                        clearTimeout(timeoutId);
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        return await response.json();
                    } catch (err) {
                        if (i === retries) throw err;
                        await new Promise(r => setTimeout(r, 500));
                    }
                }
            }

            /* ================= 工具函数 ================= */
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function formatDate(dateStr) {
                if (!dateStr || dateStr.startsWith('0001-01-01')) return '时间未知';
                try {
                    const date = new Date(dateStr);
                    if (isNaN(date.getTime())) return dateStr.split('T')[0];
                    return date.getFullYear() + '-' +
                        (date.getMonth() + 1).toString().padStart(2, '0') + '-' +
                        date.getDate().toString().padStart(2, '0');
                } catch (e) {
                    return dateStr;
                }
            }

            /* ================= 筛选栏 ================= */
            function extractDiskTypesFromResults(results) {
                const typesSet = {};
                for (let i = 0; i < results.length; i++) {
                    const pure = getPureDiskType(results[i].url);
                    if (pure !== '其他') typesSet[pure] = true;
                }
                return ['百度网盘', '阿里云盘', '夸克网盘', '迅雷网盘'].filter(t => typesSet[t]);
            }

            function renderFilterBar(typesArray) {
                const filterBar = document.getElementById('filterBar');
                const chipsContainer = document.getElementById('filterChipsContainer');
                if (!chipsContainer) return;
                if (!typesArray || typesArray.length === 0) {
                    filterBar.style.display = 'none';
                    return;
                }
                filterBar.style.display = 'flex';
                chipsContainer.innerHTML = '';

                const allChip = document.createElement('button');
                allChip.className = 'filter-chip ' + (currentFilterType === 'all' ? 'active' : '');
                allChip.textContent = '全部 (' + currentRawResults.length + ')';
                allChip.addEventListener('click', () => {
                    currentFilterType = 'all';
                    applyFilterAndRender();
                    updateFilterActiveUI();
                });
                chipsContainer.appendChild(allChip);

                typesArray.forEach(type => {
                    const count = currentRawResults.filter(item => getPureDiskType(item.url) === type).length;
                    const chip = document.createElement('button');
                    chip.className = 'filter-chip ' + (currentFilterType === type ? 'active' : '');
                    chip.textContent = type + ' (' + count + ')';
                    chip.addEventListener('click', () => {
                        currentFilterType = type;
                        applyFilterAndRender();
                        updateFilterActiveUI();
                    });
                    chipsContainer.appendChild(chip);
                });
            }

            function updateFilterActiveUI() {
                const chips = document.querySelectorAll('.filter-chip');
                chips.forEach(chip => {
                    const text = chip.textContent.split(' ')[0];
                    if (currentFilterType === 'all' && text === '全部') {
                        chip.classList.add('active');
                    } else if (currentFilterType !== 'all' && text === currentFilterType) {
                        chip.classList.add('active');
                    } else {
                        chip.classList.remove('active');
                    }
                });
            }

            function applyFilterAndRender() {
                if (!currentRawResults.length) {
                    renderEmptyOrError('empty', currentKeyword);
                    return;
                }
                let filtered = [...currentRawResults];
                if (currentFilterType !== 'all') {
                    filtered = filtered.filter(item => getPureDiskType(item.url) === currentFilterType);
                }
                if (filtered.length === 0) {
                    resultsContainer.innerHTML = '<div class="empty-state">😞 当前筛选"' + currentFilterType + '"下暂无资源<br>💡 试试其他网盘分类或清除筛选</div>';
                    statsArea.innerText = '🔍 找到 ' + currentRawResults.length + ' 条资源 · 当前筛选显示 0 条 (' + currentFilterType + ')';
                    return;
                }
                renderResultsDirect(filtered);
                statsArea.innerHTML = '✅ 共 ' + currentRawResults.length + ' 条资源 · 当前展示 ' + filtered.length + ' 条 (筛选: ' + (currentFilterType === 'all' ? '全部网盘' : currentFilterType) + ')';
            }

            function renderResultsDirect(resultsArray) {
                resultsContainer.innerHTML = '';
                for (let i = 0; i < resultsArray.length; i++) {
                    resultsContainer.insertAdjacentHTML('beforeend', renderCard(resultsArray[i]));
                }
                if (resultsArray.length > 30) {
                    const tip = document.createElement('div');
                    tip.className = 'stats';
                    tip.style.marginTop = '16px';
                    tip.style.textAlign = 'center';
                    tip.innerText = '✨ 共 ' + resultsArray.length + ' 条结果，已全部展示';
                    resultsContainer.appendChild(tip);
                }
            }

            function renderCard(item) {
                const title = item.note || '无标题资源';
                const url = item.url || '#';
                const password = item.password || '';
                const source = item.source || '未知来源';
                const datetime = item.datetime ? formatDate(item.datetime) : '时间未知';
                const noteDetail = item.note || '';
                const diskType = getDiskType(url);
                const panName = panNameByUrl(url);

                return '<div class="card" data-url="' + escapeHtml(url) + '" data-title="' + escapeHtml(title) + '" data-password="' + escapeHtml(password) + '" data-source="' + escapeHtml(source) + '">' +
                    '<div class="card-content">' +
                        '<div class="resource-title">' + escapeHtml(title) + '</div>' +
                        '<div class="meta-info">' +
                            '<span class="badge" style="background:' + typeColor(panName) + '">' + diskType + '</span>' +
                            '<span class="badge">📅 ' + datetime + '</span>' +
                            '<span class="badge">📡 ' + escapeHtml(source) + '</span>' +
                            (password ? '<span class="badge password-badge">🔑 提取码: ' + escapeHtml(password) + '</span>' : '') +
                        '</div>' +
                        (noteDetail && noteDetail !== title ? '<div class="note">📄 ' + escapeHtml(noteDetail.substring(0, 180)) + (noteDetail.length > 180 ? '…' : '') + '</div>' : '') +
                        '<button class="link-btn" onclick="tapItem(\'' + escapeHtml(url) + '\', \'' + escapeHtml(title) + '\', \'' + panName + '\', \'' + datetime + '\', \'' + escapeHtml(password) + '\')">📂 打开资源链接 →</button>' +
                    '</div>' +
                    '<div class="footer-info">' +
                        '<span>✨ 来源: ' + escapeHtml(source) + '</span>' +
                        (password ? '<span>🔐 密码: ' + escapeHtml(password) + '</span>' : '<span>🔓 无密码</span>') +
                    '</div>' +
                '</div>';
            }

            function showLoading() {
                resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div><div style="margin-top:12px;">🚀 代理加速请求中...</div></div>';
                document.getElementById('filterBar').style.display = 'none';
            }

            function showError(msg) {
                resultsContainer.innerHTML = '<div class="error-state">⚠️ 请求失败: ' + escapeHtml(msg) + '<br><br>💡 提示: 代理服务器可能繁忙，请重试或检查网络</div>';
                statsArea.innerText = '❌ 请求失败: ' + msg;
                document.getElementById('filterBar').style.display = 'none';
                currentRawResults = [];
                currentFilterType = 'all';
            }

            function renderEmptyOrError(state, kw) {
                if (state === 'empty') {
                    resultsContainer.innerHTML = '<div class="empty-state">😞 未找到关于 "' + escapeHtml(kw) + '" 的资源<br>试试其他关键词 (例如: 蜜语纪、短剧、死神来了)</div>';
                    statsArea.innerText = '🔍 没有找到与 "' + kw + '" 相关的结果';
                }
                document.getElementById('filterBar').style.display = 'none';
            }

            /* ================= 搜索 ================= */
            async function searchResources(keyword) {
                if (!keyword || keyword.trim() === '') {
                    statsArea.innerText = '⚠️ 请输入搜索关键词';
                    resultsContainer.innerHTML = '<div class="empty-state">📌 请输入电影/剧集/资源名称</div>';
                    document.getElementById('filterBar').style.display = 'none';
                    return;
                }
                const kw = keyword.trim();
                currentKeyword = kw;
                currentFilterType = 'all';

                if (cache.has(kw)) {
                    const cached = cache.get(kw);
                    currentRawResults = cached.allResults;
                    const types = extractDiskTypesFromResults(currentRawResults);
                    renderFilterBar(types);
                    applyFilterAndRender();
                    statsArea.innerHTML = '⚡ 缓存命中 · 共 ' + cached.total + ' 条资源 · 支持网盘筛选';
                    return;
                }

                statsArea.innerText = '🚀 代理加速请求中 · 关键词: ' + kw;
                showLoading();

                try {
                    const apiUrl = buildApiUrl(kw);
                    const data = await fetchWithTimeout(apiUrl, 8000, 1);

                    if (data.code !== 0 || !data.data) {
                        throw new Error(data.message || '接口返回数据异常');
                    }

                    const mergedByType = data.data.merged_by_type || {};
                    let allResults = [];
                    for (let type in mergedByType) {
                        if (Array.isArray(mergedByType[type])) {
                            allResults = allResults.concat(mergedByType[type]);
                        }
                    }

                    if (allResults.length === 0) {
                        renderEmptyOrError('empty', kw);
                        currentRawResults = [];
                        document.getElementById('filterBar').style.display = 'none';
                        return;
                    }

                    const total = data.data.total || allResults.length;
                    currentRawResults = allResults;

                    cache.set(kw, { allResults, total });
                    if (cache.size > 50) {
                        const firstKey = cache.keys().next().value;
                        cache.delete(firstKey);
                    }

                    const diskTypes = extractDiskTypesFromResults(allResults);
                    renderFilterBar(diskTypes);
                    applyFilterAndRender();
                    statsArea.innerHTML = '✅ 找到 ' + total + ' 条资源 · 支持 ' + diskTypes.length + ' 种网盘筛选 (已缓存)';

                } catch (err) {
                    console.error('搜索出错:', err);
                    if (err.name === 'AbortError') {
                        showError('请求超时 (8秒)，代理服务器响应较慢，请重试');
                    } else {
                        showError(err.message || '网络错误或代理不可用');
                    }
                }
            }

            /* ================= 点击条目：FongMi 优先直跳 ================= */
            function tapItem(url, title, panName, time, password) {
                fmReady().then(function(fm) {
                    if (fm && (fm.play || fm.pan)) {
                        // App 内：直接调播放器
                        fmPlay(url, title);
                        return;
                    }
                    // 浏览器：弹窗
                    openDetail(url, title, panName, time, password);
                });
            }
            window.tapItem = tapItem;
            window.fmReady = fmReady;
            window.fmPlay = fmPlay;
            window.openDetail = openDetail;

            /* ================= 详情弹窗 ================= */
            let curItem = null;

            function openDetail(url, title, panName, time, password) {
                curItem = { url: url, title: title, panName: panName, time: time, password: password };

                mask.classList.add('show');
                document.getElementById('mTitle').textContent = title;
                const badge = document.getElementById('mBadge');
                badge.textContent = panName;
                badge.style.background = typeColor(panName);
                document.getElementById('mTime').textContent = '📅 ' + time;
                document.getElementById('mLink').style.display = 'none';
                document.getElementById('mLoad').style.display = 'block';
                document.getElementById('mPlay').style.display = 'none';
                document.getElementById('mCopy').style.display = 'none';
                document.getElementById('mOpen').style.display = 'none';
                document.getElementById('dlgMsg').style.display = 'none';

                fmReady().then(function(fm) {
                    document.getElementById('mPlay').style.display = (fm && (fm.play || fm.pan)) ? 'block' : 'none';
                });

                // 显示链接
                setTimeout(function() {
                    if (!curItem || curItem.url !== url) return;
                    document.getElementById('mLink').innerHTML = '<b>🔗 ' + escapeHtml(url) + '</b>';
                    document.getElementById('mLink').style.display = 'block';
                    document.getElementById('mLoad').style.display = 'none';
                    document.getElementById('mCopy').style.display = 'block';
                    document.getElementById('mOpen').style.display = 'block';
                    fmReady().then(function(fm) {
                        if (fm && (fm.play || fm.pan)) {
                            document.getElementById('mPlay').style.display = 'block';
                        }
                    });
                }, 800);
            }

            document.getElementById('mClose').addEventListener('click', function() {
                mask.classList.remove('show');
                curItem = null;
            });
            mask.addEventListener('click', function(e) {
                if (e.target === mask) {
                    mask.classList.remove('show');
                    curItem = null;
                }
            });

            document.getElementById('mCopy').addEventListener('click', function() {
                if (!curItem) return;
                const url = curItem.url;
                function ok() {
                    const msg = document.getElementById('dlgMsg');
                    msg.textContent = '✅ 链接已复制';
                    msg.style.color = '#16a34a';
                    msg.style.display = 'block';
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(ok, function() { fallbackCopy(url, ok); });
                } else {
                    fallbackCopy(url, ok);
                }
            });

            function fallbackCopy(t, ok) {
                const ta = document.createElement('textarea');
                ta.value = t;
                ta.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); ok(); } catch (e) {}
                document.body.removeChild(ta);
            }

            document.getElementById('mOpen').addEventListener('click', function() {
                if (curItem && curItem.url) window.open(curItem.url, '_blank', 'noopener');
            });

            document.getElementById('mPlay').addEventListener('click', function() {
                if (!curItem) return;
                fmPlay(curItem.url, curItem.title);
            });

            /* ================= 搜索历史 ================= */
            function loadHistory() {
                try {
                    const h = JSON.parse(localStorage.getItem('panSearchHistory') || '[]');
                    if (h.length > 0) {
                        document.getElementById('history').style.display = 'block';
                        const chips = document.getElementById('hchips');
                        chips.innerHTML = '';
                        h.slice(0, 10).forEach(function(kw) {
                            const chip = document.createElement('button');
                            chip.className = 'chip';
                            chip.textContent = kw;
                            chip.addEventListener('click', function() {
                                document.getElementById('searchInput').value = kw;
                                searchResources(kw);
                            });
                            chips.appendChild(chip);
                        });
                        const clr = document.createElement('button');
                        clr.className = 'clear';
                        clr.textContent = '清除历史';
                        clr.addEventListener('click', function() {
                            localStorage.removeItem('panSearchHistory');
                            document.getElementById('history').style.display = 'none';
                        });
                        chips.appendChild(clr);
                    }
                } catch (e) {}
            }

            function saveHistory(kw) {
                try {
                    let h = JSON.parse(localStorage.getItem('panSearchHistory') || '[]');
                    h = h.filter(function(k) { return k !== kw; });
                    h.unshift(kw);
                    h = h.slice(0, 20);
                    localStorage.setItem('panSearchHistory', JSON.stringify(h));
                } catch (e) {}
            }

            /* ================= 绑定 ================= */
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const clearFilterBtn = document.getElementById('clearFilterBtn');

            searchBtn.addEventListener('click', function() {
                const kw = searchInput.value;
                if (kw.trim()) saveHistory(kw.trim());
                searchResources(kw);
            });
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const kw = searchInput.value;
                    if (kw.trim()) saveHistory(kw.trim());
                    searchResources(kw);
                }
            });

            if (clearFilterBtn) {
                clearFilterBtn.addEventListener('click', function() {
                    if (currentRawResults.length) {
                        currentFilterType = 'all';
                        applyFilterAndRender();
                        const types = extractDiskTypesFromResults(currentRawResults);
                        renderFilterBar(types);
                        updateFilterActiveUI();
                    }
                });
            }

            /* 主题切换 */
            const themeToggle = document.getElementById('themeToggle');
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
                themeToggle.textContent = '☀️';
            }
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark');
                const isDark = document.body.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeToggle.textContent = isDark ? '☀️' : '🌙';
            });

            /* FongMi 桥接状态 */
            fmReady().then(function(fm) {
                const banner = document.getElementById('fmBanner');
                const txt = document.getElementById('fmBannerTxt');
                if (fm && (fm.play || fm.pan)) {
                    banner.className = 'show ok';
                    txt.innerHTML = '已连接 <b>FongMi 影视播放器</b> —— 点击搜索结果将直接跳转播放（网盘资源需在 App 内登录对应网盘账号）';
                } else {
                    banner.className = 'show no';
                    txt.innerHTML = '当前为浏览器模式：点击结果获取真实网盘链接，可复制 / 打开。在 FongMi 影视 App 中把首页（WebHome）设为本页地址，即可点击直跳播放';
                }
            });

            /* 初始化 */
            loadHistory();
            statsArea.innerHTML = '✨ 代理加速已启用 · 支持网盘分类筛选';
        })();
    </script>
</body>
</html>
