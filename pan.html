<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>溜溜网盘搜索 - 全网网盘资源聚合</title>
<meta name="description" content="聚合夸克、百度、阿里、UC、迅雷网盘公开分享资源，支持 FongMi 影视播放器直接跳转播放。仅索引公开链接，不存储任何文件。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>">
<style>
:root{
  --p1:#7c3aed; --p2:#a78bfa; --p3:#e879f9; --b1:#38bdf8;
  --bg:#f6f5ff; --card:#ffffff; --ink:#1f2330; --sub:#6b7280;
  --line:#e9e6f8; --ok:#16a34a; --bad:#dc2626; --wait:#d97706;
  --grad:linear-gradient(135deg,#7c3aed,#a78bfa 45%,#e879f9);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16rem}
body{font-family:-apple-system,BlinkMacSystem,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}

/* ===== 顶部 ===== */
header{padding:26px 0 4px;text-align:center}
.logo{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:20px;background:var(--grad);box-shadow:0 10px 26px rgba(124,58,237,.35);font-size:34px;margin-bottom:12px}
h1{font-size:1.5rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:.5px}
.tagline{color:var(--sub);font-size:.86rem;margin-top:6px}
.tagline b{color:var(--p1)}

/* ===== 搜索框 ===== */
.searchbar{display:flex;gap:9px;margin:16px 0 12px}
.searchbar input{flex:1;min-width:0;height:48px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font-size:1rem;background:var(--card);color:var(--ink);outline:none;transition:border .2s}
.searchbar input:focus{border-color:var(--p2)}
.searchbar button{height:48px;padding:0 22px;border:none;border-radius:14px;background:var(--grad);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(124,58,237,.3)}
.searchbar button:active{transform:scale(.97)}

/* ===== 平台筛选 ===== */
.pans{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pans::-webkit-scrollbar{display:none}
.pan{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);font-size:.88rem;font-weight:600;cursor:pointer;user-select:none}
.pan .ico{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.pan.on{border-color:var(--p1);color:var(--p1);background:#f3effe}
.pan.on .ico{background:var(--p1)}

/* ===== 状态条 ===== */
#status{display:none;align-items:center;gap:10px;margin:10px 2px 14px;font-size:.85rem;color:var(--sub)}
#status.show{display:flex}
.spin{width:16px;height:16px;flex:none;border:2.5px solid var(--line);border-top-color:var(--p1);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#statusTxt b{color:var(--p1)}
#status.hideSpin .spin{display:none}

/* ===== 历史词 ===== */
#history{margin:10px 2px 4px}
#history .lbl{font-size:.75rem;color:var(--sub);margin-bottom:7px}
#history .chips{display:flex;flex-wrap:wrap;gap:8px}
#history .chip{padding:5px 13px;border-radius:99px;background:#eee9fc;color:#5b21b6;font-size:.82rem;cursor:pointer;border:none}
#history .clear{background:none;color:#c084fc;font-size:.75rem;border:none;padding:5px 2px;cursor:pointer}

/* ===== 结果列表 ===== */
#list{margin-top:8px;display:flex;flex-direction:column;gap:11px}
.item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 15px 12px;cursor:pointer;transition:box-shadow .15s,transform .1s;text-align:left;width:100%;font-family:inherit}
.item:hover{box-shadow:0 5px 18px rgba(124,58,237,.1)}
.item:active{transform:scale(.99)}
.item:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.item .top{display:flex;align-items:flex-start;gap:10px}
.badge{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff;margin-top:1px}
.title{font-size:.95rem;font-weight:700;line-height:1.45;word-break:break-all;padding-right:64px}
.desc{margin-top:6px;color:var(--sub);font-size:.8rem;line-height:1.55;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:.72rem;color:#9aa0ad}
.state{padding:2px 9px;border-radius:99px;font-weight:700}
.state.ok{background:#eafaf0;color:#15803d}
.state.bad{background:#fdecec;color:#b91c1c}
.state.unk{background:#f1f2f6;color:#8a90a0}
.state.chk{background:#fdf3e7;color:#b45309}
.acts{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.acts button{border:1.5px solid var(--line);background:#fafaff;border-radius:9px;padding:4px 10px;font-size:.72rem;color:var(--p1);font-weight:700;cursor:pointer}
.acts button:active{background:var(--p2);color:#fff;border-color:var(--p2)}
#empty{display:none;text-align:center;color:var(--sub);font-size:.88rem;padding:34px 10px;line-height:2}
#empty.show{display:block}
#toggleBad{display:none;margin:2px auto 8px;padding:6px 16px;border-radius:99px;border:1.5px dashed var(--line);background:none;color:var(--sub);font-size:.78rem;cursor:pointer}
#toggleBad.show{display:block}

/* ===== 弹窗 ===== */
#mask{display:none;position:fixed;inset:0;background:rgba(23,17,48,.55);z-index:50;align-items:flex-end;justify-content:center}
#mask.show{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 26px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.modal h3{font-size:1rem;line-height:1.5;word-break:break-all;padding-right:26px}
.x{position:absolute;top:14px;right:16px;border:none;background:#f1f2f6;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--sub);cursor:pointer}
.mwrap{position:relative}
.minfo{display:flex;gap:8px;align-items:center;margin:10px 0 4px;font-size:.75rem;color:var(--sub);flex-wrap:wrap}
.linkbox{margin-top:12px;background:#f6f5ff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;word-break:break-all;color:#374151;line-height:1.6}
.linkbox b{color:var(--p1)}
.mbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mbtns button{flex:1;min-width:110px;height:46px;border:none;border-radius:13px;font-size:.92rem;font-weight:700;cursor:pointer}
.btnPlay{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.3)}
.btnCopy{background:#f3effe;color:var(--p1);border:1.5px solid #ddd3fb}
.btnOpen{background:#eef7ff;color:#0369a1;border:1.5px solid #cbe6fb}
.tip{margin-top:14px;font-size:.74rem;color:#9aa0ad;line-height:1.7;border-top:1px dashed var(--line);padding-top:10px}
.spin2{display:inline-block;width:14px;height:14px;border:2.5px solid var(--line);border-top-color:var(--p1);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:7px}
#dlgMsg{margin-top:12px;font-size:.85rem;color:var(--bad);display:none;line-height:1.6}

footer{margin-top:34px;text-align:center;color:#b3b0c7;font-size:.72rem;line-height:1.9}
footer a{color:#a78bfa;text-decoration:none}
@media(min-width:600px){#mask{align-items:center;padding:20px}.modal{border-radius:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🛸</div>
    <h1>全网盘搜</h1>
    <div class="tagline">夸克 · 百度 · 阿里 · UC · 迅雷 <b>全网聚合</b></div>
  </header>

  <div class="searchbar">
    <input id="kw" type="search" placeholder="搜影视 / 动漫 / 课程 / 软件 / 电子书…" enterkeyhint="search" autocomplete="off">
    <button id="go">搜索</button>
  </div>

  <div class="pans" id="pans"></div>

  <div id="status"><div class="spin"></div><span id="statusTxt">正在连接公开来源…</span></div>

  <div id="history" style="display:none">
    <div class="lbl">最近搜索</div>
    <div class="chips" id="hchips"></div>
  </div>

  <div id="list"></div>
  <div id="empty"></div>
  <button id="toggleBad">显示已失效的链接</button>

  <footer>
    数据源 · 全网盘搜 · 分类筛选版 · 代理加速 · 仅索引公开链接不存储文件
  </footer>
</div>

<!-- 链接弹窗 -->
<div id="mask">
  <div class="modal mwrap">
    <button class="x" id="mClose">✕</button>
    <h3 id="mTitle"></h3>
    <div class="minfo">
      <span class="badge" id="mBadge" style="width:auto;padding:0 10px;height:24px;border-radius:7px">夸克</span>
      <span id="mTime"></span>
    </div>
    <div class="linkbox" id="mLink" style="display:none"></div>
    <div class="linkbox" id="mLoad" style="text-align:center;color:#9aa0ad"><span class="spin2"></span>正在解析真实链接…</div>
    <div id="dlgMsg"></div>
    <div class="mbtns" id="mBtns">
      <button class="btnPlay" id="mPlay" style="display:none">▶ 跳转播放</button>
      <button class="btnCopy" id="mCopy" style="display:none">复制链接</button>
      <button class="btnOpen" id="mOpen" style="display:none">打开链接</button>
    </div>
    <div class="tip" id="mTip">提示：链接为网盘分享地址，保存到自己的网盘后即可观看完整内容。</div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ================= 配置 ================= */
var ORIGIN_API = 'https://so.252035.xyz/api/search?kw=';
var PROXY_API = 'https://seep.eu.org/';
var USE_PROXY = true;

var SEARCH_TIMEOUT=25;
var POLL_INTERVAL=2500;
var PANS=[
  {t:-1,n:'全部',d:''},
  {t:0,n:'夸克',d:'pan.quark.cn'},
  {t:1,n:'阿里',d:'alipan.com'},
  {t:2,n:'百度',d:'pan.baidu.com'},
  {t:3,n:'UC',d:'drive.uc.cn'},
  {t:4,n:'迅雷',d:'pan.xunlei.com'}
];
var PAN_COLORS={'夸克':'#4f8bff','阿里':'#ff6a00','百度':'#06a7ff','UC':'#fb8c00','迅雷':'#2f6df0','115':'#2aae64','123':'#f43f5e','天翼':'#e60012','移动':'#0085d0','磁力':'#64748b','未知':'#9aa0ad'};

/* ================= 状态 ================= */
var $=function(id){return document.getElementById(id)};
var kwInput=$('kw'),goBtn=$('go'),pansBox=$('pans'),statusBar=$('status'),statusTxt=$('statusTxt'),
   =listBox=$('list'),emptyBox=$('empty'),toggleBad=$('toggleBad'),
    mask=$('mask'),histBox=$('history'),histChips=$('hchips');
var curType=-1, items=[], seq=0, elapsed=0, elapsedTimer=null, showBad=false;
var checkPending=[], checkInflight=0, checkTimer=null, checkSeq=0;

var cache = new Map();
var currentKeyword = '';

/* ================= 网盘类型识别 ================= */
function getDiskType(url) {
    if (!url) return '🔗 网盘链接';
    if (url.includes('pan.baidu.com')) return '📀 百度网盘';
    if (url.includes('aliyundrive.com')) return '☁️ 阿里云盘';
    if (url.includes('quark.cn')) return '⚛️ 夸克网盘';
    if (url.includes('xunlei.com') || url.includes('pan.xunlei.com')) return '⚡ 迅雷网盘';
    return '🔗 网盘链接';
}

function getPureDiskType(url) {
    const type = getDiskType(url);
    if (type === '📀 百度网盘') return '百度网盘';
    if (type === '☁️ 阿里云盘') return '阿里云盘';
    if (type === '⚛️ 夸克网盘') return '夸克网盘';
    if (type === '⚡ 迅雷网盘') return '迅雷网盘';
    return '其他';
}

/* ================= 网络层 ================= */
function buildApiUrl(keyword) {
    var encodedKw = encodeURIComponent(keyword);
    if (USE_PROXY) {
        return PROXY_API + ORIGIN_API + encodedKw;
    }
    return ORIGIN_API + encodedKw;
}

async function fetchWithTimeout(url, timeout, retries) {
    timeout = timeout || 8000;
    retries = retries || 1;
    for (var i = 0; i <= retries; i++) {
        try {
            var controller = new AbortController();
            var timeoutId = setTimeout(function(){ controller.abort(); }, timeout);
            var response = await fetch(url, {
                signal: controller.signal,
                headers: { 'Accept': 'application/json' }
            });
            clearTimeout(timeoutId);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return await response.json();
        } catch (err) {
            if (i === retries) throw err;
            await new Promise(function(r){ setTimeout(r, 500); });
        }
    }
}

/* ================= 工具函数 ================= */
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function formatDate(dateStr) {
    if (!dateStr || dateStr.startsWith('0001-01-01')) return '时间未知';
    try {
        var date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr.split('T')[0];
        return date.getFullYear() + '-' +
            (date.getMonth()+1).toString().padStart(2,'0') + '-' +
            date.getDate().toString().padStart(2,'0');
    } catch(e) {
        return dateStr;
    }
}

function panNameByUrl(u){
    u = String(u||'');
    if(/pan\.quark\.cn/i.test(u)) return '夸克';
    if(/drive\.uc\.cn|fast\.uc\.cn/i.test(u)) return 'UC';
    if(/alipan\.com|aliyundrive\.com/i.test(u)) return '阿里';
    if(/pan\.baidu\.com|yun\.baidu\.com/i.test(u)) return '百度';
    if(/pan\.xunlei\.com/i.test(u)) return '迅雷';
    return '其他';
}

/* ================= 渲染筛选栏 ================= */
var currentFilterType = 'all';
var currentRawResults = [];

function extractDiskTypesFromResults(results) {
    var typesSet = {};
    for (var i = 0; i < results.length; i++) {
        var pure = getPureDiskType(results[i].url);
        if (pure !== '其他') typesSet[pure] = true;
    }
    var sorted = ['百度网盘', '阿里云盘', '夸克网盘', '迅雷网盘'].filter(function(t){ return typesSet[t]; });
    return sorted;
}

function renderFilterBar(typesArray) {
    var filterBar = document.getElementById('filterBar');
    var chipsContainer = document.getElementById('filterChipsContainer');
    if (!chipsContainer) return;
    if (!typesArray || typesArray.length === 0) {
        if (filterBar) filterBar.style.display = 'none';
        return;
    }
    if (filterBar) filterBar.style.display = 'flex';
    chipsContainer.innerHTML = '';
    // 全部
    var allChip = document.createElement('button');
    allChip.className = 'filter-chip ' + (currentFilterType === 'all' ? 'active' : '');
    allChip.textContent = '全部 (' + currentRawResults.length + ')';
    allChip.addEventListener('click', function(){
        currentFilterType = 'all';
        applyFilterAndRender();
        updateFilterActiveUI();
    });
    chipsContainer.appendChild(allChip);

    typesArray.forEach(function(type){
        var count = currentRawResults.filter(function(item){ return getPureDiskType(item.url) === type; }).length;
        var chip = document.createElement('button');
        chip.className = 'filter-chip ' + (currentFilterType === type ? 'active' : '');
        chip.textContent = type + ' (' + count + ')';
        chip.addEventListener('click', function(){
            currentFilterType = type;
            applyFilterAndRender();
            updateFilterActiveUI();
        });
        chipsContainer.appendChild(chip);
    });
}

function updateFilterActiveUI() {
    var chips = document.querySelectorAll('.filter-chip');
    chips.forEach(function(chip){
        var text = chip.textContent.split(' ')[0];
        if (currentFilterType === 'all' && text === '全部') {
            chip.classList.add('active');
        } else if (currentFilterType !== 'all' && text === currentFilterType) {
            chip.classList.add('active');
        } else {
            chip.classList.remove('active');
        }
    });
}

function applyFilterAndRender() {
    if (!currentRawResults.length) {
        renderEmptyOrError('empty', currentKeyword);
        return;
    }
    var filtered = currentRawResults.slice();
    if (currentFilterType !== 'all') {
        filtered = filtered.filter(function(item){ return getPureDiskType(item.url) === currentFilterType; });
    }
    if (filtered.length === 0) {
        listBox.innerHTML = '<div class="empty-state">😞 当前筛选"' + currentFilterType + '"下暂无资源<br>💡 试试其他网盘分类或清除筛选</div>';
        statusTxt.innerHTML = '🔍 找到 ' + currentRawResults.length + ' 条资源 · 当前筛选显示 0 条 (' + currentFilterType + ')';
        return;
    }
    renderResultsDirect(filtered);
    statusTxt.innerHTML = '✅ 共 ' + currentRawResults.length + ' 条资源 · 当前展示 ' + filtered.length + ' 条 (筛选: ' + (currentFilterType === 'all' ? '全部网盘' : currentFilterType) + ')';
}

function renderResultsDirect(resultsArray) {
    listBox.innerHTML = '';
    for (var i = 0; i < resultsArray.length; i++) {
        listBox.insertAdjacentHTML('beforeend', renderCard(resultsArray[i]));
    }
}

function renderCard(item) {
    var title = item.note || '无标题资源';
    var url = item.url || '#';
    var password = item.password || '';
    var source = item.source || '未知来源';
    var datetime = item.datetime ? formatDate(item.datetime) : '时间未知';
    var noteDetail = item.note || '';
    var diskType = getDiskType(url);

    return '<div class="item" data-url="' + escapeHtml(url) + '" data-title="' + escapeHtml(title) + '" data-password="' + escapeHtml(password) + '" data-source="' + escapeHtml(source) + '" data-time="' + datetime + '">' +
        '<div class="top">' +
            '<span class="badge" style="background:' + (PAN_COLORS[panNameByUrl(url)] || '#9aa0ad') + '">' + panNameByUrl(url) + '</span>' +
            '<div class="title">' + escapeHtml(title) + '</div>' +
        '</div>' +
        (noteDetail && noteDetail !== title ? '<div class="desc">📄 ' + escapeHtml(noteDetail.substring(0, 180)) + (noteDetail.length > 180 ? '…' : '') + '</div>' : '') +
        '<div class="meta">' +
            '<span>📅 ' + datetime + '</span>' +
            '<span>📡 ' + escapeHtml(source) + '</span>' +
            (password ? '<span>🔐 ' + escapeHtml(password) + '</span>' : '<span>🔓 无密码</span>') +
        '</div>' +
        '<div class="acts">' +
            '<button onclick="openDetail(\'' + escapeHtml(url) + '\', \'' + escapeHtml(title) + '\', \'' + panNameByUrl(url) + '\', \'' + datetime + '\', \'' + escapeHtml(password) + '\')">查看详情</button>' +
        '</div>' +
    '</div>';
}

function showLoading() {
    statusTxt.innerHTML = '<b>🚀 代理加速请求中 · 关键词: ' + escapeHtml(currentKeyword) + '</b>';
    listBox.innerHTML = '<div style="text-align:center;padding:60px;color:var(--p1)"><div class="spin"></div><div style="margin-top:12px">代理加速请求中...</div></div>';
    var fb = document.getElementById('filterBar');
    if (fb) fb.style.display = 'none';
}

function showError(msg) {
    listBox.innerHTML = '<div style="text-align:center;padding:60px;color:var(--bad)"><div style="font-size:2rem">⚠️</div><div>请求失败: ' + escapeHtml(msg) + '</div><div style="margin-top:8px;font-size:.8rem;color:var(--sub)">💡 代理服务器可能繁忙，请重试</div></div>';
    statusTxt.innerHTML = '❌ 请求失败: ' + escapeHtml(msg);
    var fb = document.getElementById('filterBar');
    if (fb) fb.style.display = 'none';
    currentRawResults = [];
    currentFilterType = 'all';
}

function renderEmptyOrError(state, kw) {
    if (state === 'empty') {
        listBox.innerHTML = '<div style="text-align:center;padding:60px;color:var(--sub)"><div style="font-size:2rem">😞</div><div>未找到关于 "' + escapeHtml(kw) + '" 的资源</div><div style="margin-top:8px;font-size:.8rem">试试其他关键词 (例如: 蜜语纪、短剧、死神来了)</div></div>';
        statusTxt.innerHTML = '🔍 没有找到与 "' + kw + '" 相关的结果';
    }
    var fb = document.getElementById('filterBar');
    if (fb) fb.style.display = 'none';
}

/* ================= 搜索 ================= */
async function searchResources(keyword) {
    if (!keyword || keyword.trim() === '') {
        statusTxt.innerHTML = '⚠️ 请输入搜索关键词';
        listBox.innerHTML = '<div style="text-align:center;padding:60px;color:var(--sub)"><div style="font-size:2rem">📌</div><div>请输入电影/剧集/资源名称</div></div>';
        var fb = document.getElementById('filterBar');
        if (fb) fb.style.display = 'none';
        return;
    }
    var kw = keyword.trim();
    currentKeyword = kw;
    currentFilterType = 'all';

    if (cache.has(kw)) {
        var cached = cache.get(kw);
        currentRawResults = cached.allResults;
        var types = extractDiskTypesFromResults(currentRawResults);
        renderFilterBar(types);
        applyFilterAndRender();
        statusTxt.innerHTML = '⚡ 缓存命中 · 共 ' + cached.total + ' 条资源';
        return;
    }

    showLoading();

    try {
        var apiUrl = buildApiUrl(kw);
        var data = await fetchWithTimeout(apiUrl, 8000, 1);

        if (data.code !== 0 || !data.data) {
            throw new Error(data.message || '接口返回数据异常');
        }

        var mergedByType = data.data.merged_by_type || {};
        var allResults = [];
        for (var type in mergedByType) {
            if (Array.isArray(mergedByType[type])) {
                allResults = allResults.concat(mergedByType[type]);
            }
        }

        if (allResults.length === 0) {
            renderEmptyOrError('empty', kw);
            currentRawResults = [];
            var fb2 = document.getElementById('filterBar');
            if (fb2) fb2.style.display = 'none';
            return;
        }

        var total = data.data.total || allResults.length;
        currentRawResults = allResults;

        cache.set(kw, { allResults: allResults, total: total });
        if (cache.size > 50) {
            var firstKey = cache.keys().next().value;
            cache.delete(firstKey);
        }

        var diskTypes = extractDiskTypesFromResults(allResults);
        renderFilterBar(diskTypes);
        applyFilterAndRender();
        statusTxt.innerHTML = '✅ 找到 ' + total + ' 条资源 · 支持 ' + diskTypes.length + ' 种网盘筛选 (已缓存)';

    } catch (err) {
        console.error('搜索出错:', err);
        if (err.name === 'AbortError') {
            showError('请求超时 (8秒)，代理服务器响应较慢，请重试');
        } else {
            showError(err.message || '网络错误或代理不可用');
        }
    }
}

/* ================= 详情弹窗 ================= */
function openDetail(url, title, panName, time, password) {
    mask.style.display = 'flex';
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mBadge').textContent = panName;
    document.getElementById('mBadge').style.background = PAN_COLORS[panName] || '#9aa0ad';
    document.getElementById('mTime').textContent = '📅 ' + time;
    document.getElementById('mLink').style.display = 'none';
    document.getElementById('mLoad').style.display = 'block';
    document.getElementById('mPlay').style.display = 'none';
    document.getElementById('mCopy').style.display = 'none';
    document.getElementById('mOpen').style.display = 'none';
    document.getElementById('dlgMsg').style.display = 'none';

    document.getElementById('mPlay').onclick = function(){
        window.open(url, '_blank');
        mask.style.display = 'none';
    };
    document.getElementById('mCopy').onclick = function(){
        navigator.clipboard.writeText(url).then(function(){
            document.getElementById('dlgMsg').textContent = '✅ 链接已复制';
            document.getElementById('dlgMsg').style.color = '#16a34a';
            document.getElementById('dlgMsg').style.display = 'block';
        });
    };
    document.getElementById('mOpen').onclick = function(){
        window.open(url, '_blank');
        mask.style.display = 'none';
    };

    // 尝试解析真实链接
    setTimeout(function(){
        document.getElementById('mLink').innerHTML = '<b>🔗 ' + escapeHtml(url) + '</b>';
        document.getElementById('mLink').style.display = 'block';
        document.getElementById('mLoad').style.display = 'none';
        document.getElementById('mPlay').style.display = 'block';
        document.getElementById('mCopy').style.display = 'block';
        document.getElementById('mOpen').style.display = 'block';
    }, 800);
}

document.getElementById('mClose').onclick = function(){ mask.style.display = 'none'; };
mask.addEventListener('click', function(e){ if (e.target === mask) mask.style.display = 'none'; });

/* ================= 搜索历史 ================= */
function loadHistory() {
    try {
        var h = JSON.parse(localStorage.getItem('panSearchHistory') || '[]');
        if (h.length > 0) {
            histBox.style.display = 'block';
            histChips.innerHTML = '';
            h.slice(0, 10).forEach(function(kw){
                var chip = document.createElement('button');
                chip.className = 'chip';
                chip.textContent = kw;
                chip.onclick = function(){ kwInput.value = kw; searchResources(kw); };
                histChips.appendChild(chip);
            });
            var clr = document.createElement('button');
            clr.className = 'clear';
            clr.textContent = '清除历史';
            clr.onclick = function(){
                localStorage.removeItem('panSearchHistory');
                histBox.style.display = 'none';
            };
            histChips.appendChild(clr);
        }
    } catch(e) {}
}

function saveHistory(kw) {
    try {
        var h = JSON.parse(localStorage.getItem('panSearchHistory') || '[]');
        h = h.filter(function(k){ return k !== kw; });
        h.unshift(kw);
        h = h.slice(0, 20);
        localStorage.setItem('panSearchHistory', JSON.stringify(h));
    } catch(e) {}
}

/* ================= 绑定 ================= */
goBtn.addEventListener('click', function(){
    var kw = kwInput.value;
    if (kw.trim()) saveHistory(kw.trim());
    searchResources(kw);
});
kwInput.addEventListener('keypress', function(e){
    if (e.key === 'Enter') {
        var kw = kwInput.value;
        if (kw.trim()) saveHistory(kw.trim());
        searchResources(kw);
    }
});

toggleBad.addEventListener('click', function(){
    showBad = !showBad;
    toggleBad.textContent = showBad ? '隐藏已失效的链接' : '显示已失效的链接';
    applyFilterAndRender();
});

/* 初始化 */
loadHistory();
statusBar.style.display = 'flex';
statusTxt.innerHTML = '✨ 代理加速已启用 · 支持网盘分类筛选';
</script>
