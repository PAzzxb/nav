<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直播源 · 溜溜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #7c3aed, #a78bfa, #e879f9, #38bdf8);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            padding: 24px 16px;
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 18px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            font-size: 22px;
        }

        .card {
            display: block;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            color: #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            width: 100%;
            font-family: inherit;
            line-height: 1.4;
        }

        .card:hover,
        .card:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        }

        /* —— 抓取按钮特殊样式 —— */
        .card-grab {
            background: rgba(255, 215, 0, 0.90);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #1e2a3a;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 24px rgba(255, 215, 0, 0.35);
            position: relative;
            overflow: hidden;
        }

        .card-grab::after {
            content: "⚡";
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.7;
        }

        .card-grab:hover {
            background: rgba(255, 215, 0, 0.98);
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.50);
        }

        .card-grab .badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 20px;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
            color: #1e2a3a;
            letter-spacing: 0.3px;
        }

        /* —— 状态微标 —— */
        .card-grab .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
            background: #22c55e;
            transition: background 0.3s ease;
            vertical-align: middle;
        }

        .card-grab .status-dot.busy {
            background: #f59e0b;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        /* —— Toast —— */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 999;
            max-width: calc(100% - 32px);
            text-align: center;
            backdrop-filter: blur(4px);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* —— 复制提示小标签 —— */
        .card .hint {
            font-size: 12px;
            font-weight: 400;
            color: #888;
            display: block;
            margin-top: 4px;
        }

        .card-grab .hint {
            color: #4b3d0e;
        }

        /* —— 第三方直播源 —— */
        .card-own {
            background: linear-gradient(135deg, rgba(124, 58, 237, .92), rgba(232, 121, 249, .92));
            color: #fff;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 24px rgba(124, 58, 237, 0.45);
        }
        .card-own:hover {
            background: linear-gradient(135deg, rgba(124, 58, 237, 1), rgba(232, 121, 249, 1));
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.6);
        }
        .card-own .hint {
            color: rgba(255, 255, 255, 0.85);
        }

        /* —— 体育直播卡片特殊点缀 —— */
        .card-sport {
            background: rgba(255, 255, 255, 0.92);
            border-left: 4px solid #f97316;
        }
        .card-sport .sport-icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">

        <h2>📺 溜溜 · 直播源</h2>
        <a href="./" style="display:block;text-align:center;color:rgba(255,255,255,.9);font-size:13px;text-decoration:none;text-shadow:0 1px 4px rgba(0,0,0,.3);margin:-10px 0 16px;">← 返回主页</a>

        <!-- ===== 直播源抓取按钮 ===== -->
        <button class="card card-grab" id="grabBtn">
            <span class="status-dot" id="grabDot"></span>
            直播源抓取
            <span class="badge">v1.0</span>
            <span class="hint">点击抓取最新直播源</span>
        </button>

        <!-- ===== 直播源卡片列表 ===== -->
        <div class="card card-own" data-url="https://liuliu-c8f.pages.dev/live.m3u">🛸 溜溜 IPTV（自维护）<span class="hint">点击复制 · 咪咕ITV+央卫视+虎牙实时</span></div>
        <div class="card" data-url="https://liuliu-c8f.pages.dev/huya.m3u">🎮 虎牙直播源（自维护）<span class="hint">点击复制 · 实时签名 302 直链</span></div>

        <!-- ★ 原“咖啡体育直播源” → 已改为“体育直播” ★ -->
        <div class="card card-sport" data-url="https://jsnzkpg.de5.net/all.m3u">
            <span class="sport-icon">⚽</span>体育直播
            <span class="hint">点击复制链接</span>
        </div>

        <div class="card" data-url="https://stymei.pages.dev/live.m3u">松果体育直播源</div>
        <div class="card" data-url="https://douyin.445569.xyz/live.m3u">抖音直播源</div>
        <div class="card" data-url="https://kuaishou.445569.xyz/list.m3u">快手直播源</div>
        <div class="card" data-url="https://huya.445569.xyz/live.m3u">虎牙直播源</div>
        <div class="card" data-url="https://douyu.445569.xyz/live.m3u">斗鱼直播源</div>
        <div class="card" data-url="https://twitch.445569.xyz/live.m3u">Twitch直播源</div>
        <div class="card" data-url="https://tiktok.445569.xyz/live.m3u">TikTok直播源 [翻墙]</div>
        <div class="card" data-url="https://stymei1.pages.dev/live.m3u">GTA游戏直播源</div>
    </div>

    <div id="toast">已复制链接</div>

    <script>
        // ===== Toast =====
        const toast = document.getElementById('toast');
        let toastTimer = null;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ===== 复制功能（兼容） =====
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            ta.style.left = '-9999px';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制：' + text);
            } catch (e) {
                showToast('❌ 复制失败，请手动复制');
            }
            document.body.removeChild(ta);
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('✅ 已复制：' + text))
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        // ===== 所有卡片点击复制（抓取按钮除外） =====
        document.querySelectorAll('.card:not(.card-grab)').forEach(card => {
            card.addEventListener('click', () => {
                const url = card.dataset.url;
                if (url) copyText(url);
            });
        });

        // ============================================================
        //  🚀  直播源抓取 按钮逻辑（固定目标地址）
        // ============================================================
        const grabBtn = document.getElementById('grabBtn');
        const grabDot = document.getElementById('grabDot');

        let isGrabbing = false;

        // ★★★ 固定的抓取目标（您指定的地址） ★★★
        const TARGET_URL = 'https://liuliu-c8f.pages.dev/live.m3u';

        async function performGrab() {
            if (isGrabbing) return;

            isGrabbing = true;
            grabDot.classList.add('busy');
            grabBtn.style.pointerEvents = 'none';

            grabBtn.innerHTML = `
                <span class="status-dot busy" id="grabDot"></span>
                正在抓取 …
                <span class="badge">⏳</span>
                <span class="hint">请稍候，正在获取直播源</span>
            `;

            try {
                // 模拟异步抓取（保留体验，可替换为真实请求）
                await new Promise((resolve) => setTimeout(resolve, 1500));

                // 直接复制固定的目标地址
                await copyText(TARGET_URL);
                showToast('✅ 抓取成功！已复制：' + TARGET_URL);

                grabBtn.innerHTML = `
                    <span class="status-dot" id="grabDot"></span>
                    抓取成功 ✓
                    <span class="badge">已就绪</span>
                    <span class="hint">${TARGET_URL}</span>
                `;
                grabDot.classList.remove('busy');

                setTimeout(() => {
                    if (!isGrabbing) {
                        grabBtn.innerHTML = `
                            <span class="status-dot" id="grabDot"></span>
                            直播源抓取
                            <span class="badge">v1.0</span>
                            <span class="hint">点击抓取最新直播源</span>
                        `;
                        const newDot = document.getElementById('grabDot');
                        if (newDot) newDot.classList.remove('busy');
                    }
                }, 2500);

            } catch (err) {
                console.error('抓取失败:', err);
                showToast('❌ 抓取失败，请重试');
                grabBtn.innerHTML = `
                    <span class="status-dot" id="grabDot"></span>
                    直播源抓取
                    <span class="badge">v1.0</span>
                    <span class="hint">点击抓取最新直播源</span>
                `;
                grabDot.classList.remove('busy');
            } finally {
                isGrabbing = false;
                grabBtn.style.pointerEvents = 'auto';
                const finalDot = document.getElementById('grabDot');
                if (finalDot) finalDot.classList.remove('busy');
            }
        }

        grabBtn.addEventListener('click', performGrab);

        document.addEventListener('DOMContentLoaded', () => {
            const dot = document.getElementById('grabDot');
            if (dot) dot.classList.remove('busy');
        });

        console.log('📡 直播源导航已启动 | 抓取目标固定为：' + TARGET_URL);
    </script>
</body>
</html>
