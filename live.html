<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直播源 · 溜溜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #7c3aed, #a78bfa, #e879f9, #38bdf8);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            padding: 24px 16px;
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 18px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            font-size: 22px;
        }

        .card {
            display: block;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            color: #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            width: 100%;
            font-family: inherit;
            line-height: 1.4;
        }

        .card:hover,
        .card:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        }





        /* —— 状态微标 —— */


        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        /* —— Toast —— */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 999;
            max-width: calc(100% - 32px);
            text-align: center;
            backdrop-filter: blur(4px);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* —— 复制提示小标签 —— */
        .card .hint {
            font-size: 12px;
            font-weight: 400;
            color: #888;
            display: block;
            margin-top: 4px;
        }


        /* —— 第三方直播源 —— */

        /* —— 体育直播卡片特殊点缀 —— */
        .card-sport {
            background: rgba(255, 255, 255, 0.92);
            border-left: 4px solid #f97316;
        }
        .card-sport .sport-icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">

        <h2>📺 溜溜 · 直播源</h2>
        <a href="./" style="display:block;text-align:center;color:rgba(255,255,255,.9);font-size:13px;text-decoration:none;text-shadow:0 1px 4px rgba(0,0,0,.3);margin:-10px 0 16px;">← 返回主页</a>

        <!-- ===== 直播源卡片列表 ===== -->
        <!-- ★ 原“咖啡体育直播源” → 已改为“体育直播” ★ -->
        <div class="card card-sport" data-url="https://jsnzkpg.de5.net/all.m3u">
            <span class="sport-icon">⚽</span>体育直播
            <span class="hint">点击复制链接</span>
        </div>

        <div class="card" data-url="https://stymei.pages.dev/live.m3u">松果体育直播源</div>
        <div class="card" data-url="https://douyin.445569.xyz/live.m3u">抖音直播源</div>
        <div class="card" data-url="https://kuaishou.445569.xyz/list.m3u">快手直播源</div>
        <div class="card" data-url="https://huya.445569.xyz/live.m3u">虎牙直播源</div>
        <div class="card" data-url="https://douyu.445569.xyz/live.m3u">斗鱼直播源</div>
        <div class="card" data-url="https://twitch.445569.xyz/live.m3u">Twitch直播源</div>
        <div class="card" data-url="https://tiktok.445569.xyz/live.m3u">TikTok直播源 [翻墙]</div>
        <div class="card" data-url="https://stymei1.pages.dev/live.m3u">GTA游戏直播源</div>
    </div>

    <div id="toast">已复制链接</div>

    <script>
        // ===== Toast =====
        const toast = document.getElementById('toast');
        let toastTimer = null;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ===== 复制功能（兼容） =====
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            ta.style.left = '-9999px';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制：' + text);
            } catch (e) {
                showToast('❌ 复制失败，请手动复制');
            }
            document.body.removeChild(ta);
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('✅ 已复制：' + text))
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        // ===== 所有卡片点击复制（抓取按钮除外） =====
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                const url = card.dataset.url;
                if (url) copyText(url);
            });
        });

    </script>
</body>
</html>
