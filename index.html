<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>溜溜导航</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>" />

    <script>
        (function() {
            try {
                var t = localStorage.getItem('theme') || 'dark';
                document.documentElement.classList.toggle('day', t === 'light');
            } catch (e) {}
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        :root {
            --bg1: #0b0f1a;
            --bg2: #12182b;
            --bg3: #1a1035;
            --panel: rgba(15, 23, 42, .55);
            --border: rgba(99, 102, 241, .28);
            --fg: #e2e8f0;
            --muted-fg: #94a3b8;
            --title-g: linear-gradient(90deg, #a78bfa, #e879f9, #38bdf8);
            --star-c: #fff;
            --star-max: 1;
        }
        html.day {
            --bg1: #e0f2fe;
            --bg2: #f0f9ff;
            --bg3: #ede9fe;
            --panel: rgba(255, 255, 255, .62);
            --border: rgba(99, 102, 241, .22);
            --fg: #1e293b;
            --muted-fg: #64748b;
            --title-g: linear-gradient(90deg, #7c3aed, #db2777, #0284c7);
            --star-c: #7c3aed;
            --star-max: .35;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100dvh;
            background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
            color: var(--fg);
            font-family: 'Nunito', system-ui, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background .4s, color .3s;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -6%;
            z-index: -3;
            background: url("https://pic.feria.eu.org/1f9sfXr7/IMG-2026-08-23-0849324470.jpg") center/cover no-repeat;
            animation: bgDrift 40s ease-in-out infinite alternate;
            pointer-events: none;
            will-change: transform;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            transition: background .4s;
            background:
                radial-gradient(ellipse at 50% 25%, rgba(11, 15, 26, .55) 0%, rgba(11, 15, 26, .82) 55%, rgba(10, 7, 26, .94) 100%),
                linear-gradient(160deg, rgba(11, 15, 26, .6), rgba(18, 24, 43, .55) 45%, rgba(26, 16, 53, .7));
        }
        html.day body::after {
            background:
                radial-gradient(ellipse at 50% 25%, rgba(255, 255, 255, .62) 0%, rgba(240, 249, 255, .85) 55%, rgba(237, 233, 254, .94) 100%),
                linear-gradient(160deg, rgba(224, 242, 254, .6), rgba(240, 249, 255, .55) 45%, rgba(237, 233, 254, .65));
        }
        @keyframes bgDrift {
            from {
                transform: scale(1.06) translate(-1.2%, -.8%);
            }
            to {
                transform: scale(1.12) translate(1.2%, .8%);
            }
        }

        .star-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-repeat: repeat;
            animation: starTwinkle 5s ease-in-out infinite;
            will-change: opacity;
        }
        .star-layer--1 {
            background-image:
                radial-gradient(1.6px 1.6px at 20px 30px, var(--star-c), transparent),
                radial-gradient(1.4px 1.4px at 130px 90px, var(--star-c), transparent),
                radial-gradient(1.8px 1.8px at 70px 160px, #a78bfa, transparent),
                radial-gradient(1.2px 1.2px at 190px 45px, var(--star-c), transparent);
            background-size: 220px 220px;
        }
        .star-layer--2 {
            background-image:
                radial-gradient(2.4px 2.4px at 60px 50px, var(--star-c), transparent),
                radial-gradient(1.8px 1.8px at 200px 150px, #e879f9, transparent),
                radial-gradient(2px 2px at 120px 210px, #38bdf8, transparent);
            background-size: 340px 340px;
            animation-duration: 7s;
            animation-delay: -2.5s;
        }
        @keyframes starTwinkle {
            0%,
            100% {
                opacity: calc(var(--star-max) * .45);
            }
            50% {
                opacity: var(--star-max);
            }
        }

        .page {
            max-width: 64rem;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 2rem 1rem 0;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 640px) {
            .page {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }
        }
        @media (min-width: 1024px) {
            .page {
                padding-left: 2rem;
                padding-right: 2rem;
            }
        }

        /* ===== 顶栏 ===== */
        .site-header {
            display: flex;
            align-items: center;
            gap: .625rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }
        /* ===== 品牌徽标：轨道 + 飞碟（纯 CSS，无图片） ===== */
        .brand-badge {
            position: relative;
            width: 2.3rem;
            height: 2.3rem;
            flex-shrink: 0;
        }
        .brand-core {
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #1e2540, #141a2e);
            box-shadow: inset 0 0 8px rgba(167, 139, 250, .35), 0 0 12px rgba(167, 139, 250, .25);
        }
        .brand-ufo {
            font-size: 1rem;
            line-height: 1;
            display: inline-block;
            animation: ufoFloat 2.6s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(232, 121, 249, .55));
        }
        @keyframes ufoFloat {
            0%, 100% { transform: translateY(1.5px) rotate(-5deg); }
            50% { transform: translateY(-2px) rotate(5deg); }
        }
        .brand-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0 15%, #a78bfa 35%, #e879f9 52%, transparent 70% 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            animation: ringSpin 3.6s linear infinite;
        }
        @keyframes ringSpin { to { transform: rotate(1turn); } }
        .brand-sat {
            position: absolute;
            top: -2px;
            left: 50%;
            width: 5px;
            height: 5px;
            margin-left: -2.5px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 6px #38bdf8;
            transform-origin: 2.5px calc(1.15rem - .5px);
            animation: satOrbit 5s linear infinite;
        }
        @keyframes satOrbit { to { transform: rotate(1turn); } }
        .brand-id {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: .1rem;
            min-width: 0;
        }
        .brand-name {
            font-size: 1.08rem;
            font-weight: 800;
            letter-spacing: .02em;
            color: var(--fg);
            text-shadow: 0 0 14px rgba(167, 139, 250, .45);
            white-space: nowrap;
        }
        .brand-sub {
            font-size: .55rem;
            font-weight: 700;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--muted-fg);
            opacity: .85;
        }
        .social {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
        }
        .social a {
            color: var(--muted-fg);
            display: flex;
            transition: color .15s, transform .15s;
        }
        .social a:hover {
            color: #a78bfa;
            transform: translateY(-1px);
        }
        .social svg {
            width: 1.05rem;
            height: 1.05rem;
        }

        /* ===== 每日一言 · 上下轮播 ===== */
        .ticker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .55rem;
            margin-bottom: 0.9rem;
            padding: .55rem 1rem;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(8px);
            border-radius: .75rem;
            overflow: hidden;
        }
        .ticker__icon {
            font-size: .95rem;
            line-height: 1;
            animation: tickerPop 3.6s ease-in-out infinite;
        }
        @keyframes tickerPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.16) rotate(10deg); }
        }
        .ticker__view {
            position: relative;
            flex: 1;
            max-width: 30rem;
            height: 1.35rem;
            overflow: hidden;
        }
        .ticker__line {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: .06em;
            color: var(--muted-fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: transform .45s cubic-bezier(.22, .9, .36, 1), opacity .45s ease;
        }
        .ticker__line.is-out {
            transform: translateY(-110%);
            opacity: 0;
        }
        .ticker__line.is-in {
            transform: translateY(110%);
            opacity: 0;
            transition: none;
        }

        /* ===== 时间 + 控制条 ===== */
        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .meta-text {
            font-size: .8rem;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: .3px;
            background: var(--title-g);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #timeLine {
            font-variant-numeric: tabular-nums;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: .25rem;
            padding: .25rem;
            border: 1px solid var(--border);
            border-radius: .85rem;
            background: var(--panel);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }
        .control-group button {
            height: 1.85rem;
            padding: 0 .55rem;
            display: flex;
            align-items: center;
            gap: .3rem;
            border: none;
            border-radius: .6rem;
            background: none;
            color: var(--muted-fg);
            font-family: inherit;
            font-size: .75rem;
            cursor: pointer;
            transition: background .15s, color .15s;
        }
        .control-group button:hover {
            background: rgba(167, 139, 250, .18);
            color: var(--fg);
        }
        .control-group button.active {
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            box-shadow: 0 0 10px rgba(167, 139, 250, .45);
        }
        .control-group svg {
            width: .9rem;
            height: .9rem;
        }
        .control-divider {
            width: 1px;
            height: 1rem;
            margin: 0 .15rem;
            background: var(--border);
        }
        .kbd {
            font-size: .65rem;
            opacity: .75;
        }
        @media (max-width: 480px) {
            .kbd {
                display: none;
            }
        }

        /* ===== 分类胶囊 ===== */
        .tabs-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .tabs {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .3rem;
            padding: .3rem;
            border: 1px solid var(--border);
            border-radius: 1.15rem;
            background: var(--panel);
            backdrop-filter: blur(10px);
        }
        .tabs button {
            padding: .4rem .85rem;
            border: 1px solid transparent;
            border-radius: .75rem;
            background: none;
            color: var(--muted-fg);
            font-family: inherit;
            font-size: .78rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, color .2s, box-shadow .2s;
        }
        .tabs button:hover {
            background: rgba(167, 139, 250, .16);
            color: var(--fg);
        }
        .tabs button.active {
            color: #fff;
            background-image: var(--title-g);
            box-shadow: 0 0 12px rgba(167, 139, 250, .4);
            border-color: rgba(255, 255, 255, .3);
        }

        /* ===== 卡片网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: .75rem;
        }
        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .card {
            position: relative;
            display: flex;
            align-items: center;
            gap: .625rem;
            padding: .8rem .75rem;
            border: 1px solid rgba(255, 255, 255, .24);
            border-radius: 1rem;
            text-decoration: none;
            color: #fff;
            overflow: hidden;
            isolation: isolate;
            background-image: linear-gradient(135deg, var(--c1), var(--c2) 55%, var(--c3));
            box-shadow: 0 2px 10px rgba(0, 0, 0, .2), 0 0 14px rgba(var(--glow), .32);
            transform: translateZ(0);
            transition: transform .2s ease, box-shadow .25s ease, border-color .25s ease;
        }
        @media (min-width: 640px) {
            .card {
                gap: .875rem;
                padding: 1rem;
            }
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, .5);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .28), 0 0 22px rgba(var(--glow), .6), 0 0 40px rgba(var(--glow), .28);
        }
        .card:active {
            transform: translateY(0) scale(.985);
        }

        .card::before {
            content: "";
            position: absolute;
            top: -50%;
            bottom: -50%;
            left: 0;
            width: 45%;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .18), transparent);
            transform: translateX(-160%) rotate(12deg);
            animation: sweep 9s cubic-bezier(.4, 0, .6, 1) infinite;
            animation-delay: var(--delay, 0s);
            will-change: transform;
        }
        @keyframes sweep {
            0% {
                transform: translateX(-160%) rotate(12deg);
            }
            45%,
            100% {
                transform: translateX(340%) rotate(12deg);
            }
        }

        .card.featured {
            border-color: rgba(255, 255, 255, .42);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .24), 0 0 20px rgba(var(--glow), .5), 0 0 38px rgba(var(--glow), .22);
        }
        .card.featured:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3), 0 0 28px rgba(var(--glow), .75), 0 0 52px rgba(var(--glow), .35);
        }
        .card.featured::before {
            animation-duration: 6.5s;
        }

        .card-icon {
            width: 2rem;
            height: 2rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: .6rem;
            background: rgba(255, 255, 255, .2);
            border: 1px solid rgba(255, 255, 255, .28);
            font-size: 1rem;
            line-height: 1;
        }
        @media (min-width: 640px) {
            .card-icon {
                width: 2.5rem;
                height: 2.5rem;
                border-radius: .8rem;
                font-size: 1.2rem;
            }
        }

        .card-body {
            min-width: 0;
            flex: 1;
        }
        .card-name {
            display: block;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .35);
        }
        .card-desc {
            margin-top: .15rem;
            font-size: .65rem;
            color: rgba(255, 255, 255, .88);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .3);
        }
        @media (min-width: 640px) {
            .card-name {
                font-size: .9rem;
            }
            .card-desc {
                font-size: .75rem;
            }
        }

        .empty {
            padding: 3rem 0;
            text-align: center;
            font-size: .8rem;
            color: var(--muted-fg);
        }
        .empty[hidden] {
            display: none;
        }

        /* ===== 搜索浮层 ===== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: flex;
            justify-content: center;
            padding-top: 18vh;
            background: rgba(5, 7, 15, .55);
            backdrop-filter: blur(5px);
        }
        .overlay[hidden] {
            display: none;
        }
        .search-box {
            width: min(90%, 32rem);
            height: fit-content;
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .85rem 1.1rem;
            border: 2px solid transparent;
            border-radius: 1rem;
            background: linear-gradient(var(--bg2), var(--bg2)) padding-box, var(--title-g) border-box;
            box-shadow: 0 0 26px rgba(167, 139, 250, .4);
        }
        html.day .search-box {
            background: linear-gradient(#fff, #fff) padding-box, var(--title-g) border-box;
        }
        .search-box svg {
            width: 1.05rem;
            height: 1.05rem;
            color: var(--muted-fg);
            flex-shrink: 0;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: none;
            color: var(--fg);
            font-family: inherit;
            font-size: .9rem;
        }
        .search-box input::placeholder {
            color: var(--muted-fg);
        }

        /* ===== 右下角白天/黑夜切换 ===== */
        .fab-theme {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 60;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--panel);
            backdrop-filter: blur(10px);
            color: var(--fg);
            font-size: .95rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
            transition: transform .18s ease, box-shadow .25s ease, border-color .25s ease;
        }
        .fab-theme:hover {
            transform: scale(1.08);
            border-color: rgba(167, 139, 250, .6);
            box-shadow: 0 0 16px rgba(167, 139, 250, .4);
        }
        .fab-theme:active {
            transform: scale(.92);
        }
        @media (max-width: 480px) {
            .fab-theme {
                right: 14px;
                bottom: 14px;
                width: 30px;
                height: 30px;
                font-size: .82rem;
            }
        }

        /* ===== 页脚 ===== */
        footer {
            margin-top: auto;
            padding: 2.5rem 0 3.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }
        .footer-sections {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .footer-sections section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .7rem;
        }
        .footer-title {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .06em;
            background: var(--title-g);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: .4rem 1.1rem;
            font-size: .72rem;
            color: var(--muted-fg);
        }

        /* ===== 友情链接：炫彩渐变胶囊按钮 ===== */
        .friend-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: .6rem;
        }
        .friend-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .5rem 1.05rem;
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 999px;
            overflow: hidden;
            isolation: isolate;
            color: #fff;
            font-size: .76rem;
            font-weight: 700;
            letter-spacing: .3px;
            text-decoration: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .35);
            background-image: linear-gradient(135deg, var(--c1), var(--c2) 55%, var(--c3));
            box-shadow: 0 2px 10px rgba(0, 0, 0, .22), 0 0 16px rgba(var(--glow), .45);
            transform: translateZ(0);
            transition: transform .2s ease, box-shadow .25s ease, border-color .25s ease;
        }
        .friend-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, .55);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .3), 0 0 24px rgba(var(--glow), .75), 0 0 44px rgba(var(--glow), .35);
        }
        .friend-btn:active {
            transform: translateY(0) scale(.97);
        }
        .friend-btn::before {
            content: "";
            position: absolute;
            top: -50%;
            bottom: -50%;
            left: 0;
            width: 42%;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .28), transparent);
            transform: translateX(-170%) rotate(12deg);
            animation: sweep 7s cubic-bezier(.4, 0, .6, 1) infinite;
            animation-delay: var(--delay, 0s);
            will-change: transform;
        }
        .friend-btn .fb-icon {
            font-size: .85rem;
            line-height: 1;
        }

        .copyright {
            font-size: .7rem;
            color: var(--muted-fg);
            opacity: .8;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            body::before,
            .card::before,
            .friend-btn::before,
            .brand-ring,
            .brand-sat,

    function categories() {
        var seen = [];
        SITES.forEach(function(s) { if (seen.indexOf(s.cat) === -1) seen.push(s.cat); });
        return ['全部'].concat(seen);
    }

    function renderTabs() {
        tabs.innerHTML = '';
        categories().forEach(function(cat) {
            var btn = document.createElement('button');
            btn.textContent = cat;
            btn.className = cat === activeCat ? 'active' : '';
            btn.onclick = function() { activeCat = cat;
                renderTabs();
                renderGrid(); };
            tabs.appendChild(btn);
        });
    }

    function matches(site) {
        if (activeCat !== '全部' && site.cat !== activeCat) return false;
        if (!keyword) return true;
        var k = keyword.toLowerCase();
        return (site.name + site.desc + site.url + site.cat).toLowerCase().indexOf(k) !== -1;
    }

    function renderGrid() {
        var list = SITES.filter(matches);
        grid.innerHTML = '';

        list.forEach(function(site, i) {
            var a = document.createElement('a');
            a.className = 'card' + (site.feat ? ' featured' : '');
            a.href = site.url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.title = site.name + ' — ' + site.desc;

            var g = site.rand ? [randomHex(), randomHex(), randomHex()] : site.g;
            a.style.setProperty('--c1', g[0]);

            a.style.setProperty('--c3', g[2]);
            a.style.setProperty('--glow', site.glow);

            var name = document.createElement('span');
            name.className = 'card-name';
            name.textContent = site.name;

            var desc = document.createElement('p');
            desc.className = 'card-desc';
            desc.textContent = site.desc;

            body.appendChild(name);
            body.appendChild(desc);
            a.appendChild(icon);
            a.appendChild(body);
            grid.appendChild(a);
        });

        empty.hidden = list.length > 0;
        statLine.textContent = '共 ' + SITES.length + ' 个站点 · ' + (categories().length - 1) + ' 个分类';
    }

    renderTabs();
    renderGrid();

    var overlay = document.getElementById('searchOverlay');
    var input = document.getElementById('searchInput');

    function openSearch() { overlay.hidden = false;
        input.focus();
        input.select(); }

    function closeSearch() { overlay.hidden = true; }

    document.getElementById('searchBtn').onclick = openSearch;
    overlay.onclick = function(e) { if (e.target === overlay) closeSearch(); };
    input.oninput = function() { keyword = input.value.trim();
        renderGrid(); };

    document.addEventListener('keydown', function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            overlay.hidden ? openSearch() : closeSearch();
        } else if (e.key === 'Escape' && !overlay.hidden) {
            closeSearch();

    });

    try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}

    }
    applyTheme();

    themeBtn.onclick = function() {
        theme = (theme === 'light') ? 'dark' : 'light';
        try { localStorage.setItem('theme', theme); } catch (e) {}
        applyTheme();
    };

    function tick() {
        var n = new Date();
        var w = ['日', '一', '二', '三', '四', '五', '六'][n.getDay()];
        var p = function(v) { return ('0' + v).slice(-2); };
        document.getElementById('dateLine').textContent =
            n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()) + ' 星期' + w;
        document.getElementById('timeLine').textContent =
            p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
    }

        quoteIdx = (quoteIdx + 1) % QUOTES.length;
        tickerLine.classList.add('is-out');
        setTimeout(function() {
            tickerLine.textContent = QUOTES[quoteIdx];
            tickerLine.classList.remove('is-out');
            tickerLine.classList.add('is-in');
            void tickerLine.offsetHeight;
            tickerLine.classList.remove('is-in');
        }, 460);
    }, 3600);

    var audio = document.getElementById('audio');
    var musicBtn = document.getElementById('musicBtn');

    audio.src = SONG;
    audio.loop = true;
    audio.volume = 0.6;

    function syncBtn() {
        musicBtn.classList.toggle('active', !audio.paused);
        musicBtn.title = audio.paused ? '播放背景音乐' : '暂停背景音乐';
    }

    function tryAutoplay() {
        audio.play().then(syncBtn).catch(function() {
            var events = ['pointerdown', 'keydown', 'touchstart', 'wheel'];
            var once = function() {
                audio.play().then(syncBtn).catch(function(e) {
                    console.warn('音频播放失败：', e);
                });
                events.forEach(function(ev) { document.removeEventListener(ev, once); });
            };
            events.forEach(function(ev) {
                document.addEventListener(ev, once, { passive: true });
            });
        });
    }
    tryAutoplay();

    musicBtn.onclick = function() {
        if (audio.paused) {
            audio.play().then(syncBtn).catch(function(e) { console.warn(e); });
